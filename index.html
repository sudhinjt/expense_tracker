<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Expenses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 pb-24 max-w-md mx-auto font-sans">
  
  <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Shared Expenses</h1>
  
  <!-- Data Entry Form -->
  <details class="bg-white p-4 rounded-xl shadow-sm mb-6 group" open>
    <summary class="flex justify-between items-center cursor-pointer text-gray-600">
      <span class="font-semibold text-lg">Log New Expense</span>
      <span class="group-open:rotate-180 transform transition-transform">▼</span>
    </summary>
    <form id="expenseForm" class="space-y-4 pt-4 mt-2 border-t">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Amount (₹)</label>
          <input type="number" id="amount" step="0.01" required class="w-full border rounded-lg p-2 bg-gray-50" placeholder="0.00">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Paid By</label>
          <select id="paidBy" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>Mereena</option>
            <option>Sudhin</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Category</label>
          <select id="category" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>Groceries</option>
            <option>Food & Dining</option>
            <option>Utilities & EMI</option>
            <option>Vehicle & Fuel</option>
            <option>Shopping</option>
            <option>Investment</option>
            <option>Entertainment</option>
            <option>Misc</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Payment Mode</label>
          <select id="paymentMode" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>UPI</option>
            <option>Credit/Debit Card</option>
            <option>Cash</option>
            <option>Net Banking</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Date</label>
        <input type="date" id="date" required class="w-full border rounded-lg p-2 bg-gray-50">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Description</label>
        <input type="text" id="desc" required class="w-full border rounded-lg p-2 bg-gray-50" placeholder="e.g., Weekly groceries">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition">Log Expense</button>
    </form>
  </details>

  <!-- Dashboard Breakdown -->
  <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
    <div class="flex justify-between items-center mb-5 pb-2 border-b">
      <h2 class="text-xl font-bold text-gray-800">Monthly View</h2>
      <input type="month" id="displayMonth" class="border rounded-lg p-2 text-sm bg-gray-50">
    </div>

    <div class="mb-5">
      <h2 class="text-sm font-bold text-gray-500 mb-2">TOTAL SPENT (SELECTED MONTH)</h2>
      <p class="text-4xl font-extrabold text-gray-900" id="totalSpent">₹0.00</p>
    </div>

    <div class="h-64 mb-2">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- Transactions -->
  <div class="bg-white p-4 rounded-xl shadow-sm">
    <h2 class="text-sm font-bold text-gray-500 mb-4 uppercase">Spends in Selected Month</h2>
    <div id="expenseList" class="space-y-3">
      <!-- Injected rows -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 🔴 REPLACE THIS BLOCK WITH YOUR ACTUAL FIREBASE KEYS
    const firebaseConfig = {
      apiKey: "AIzaSyDZWHm1lcBIXVYG0a-iKl_5e6Dj4xe2ShM",
      authDomain: "expense-tracker-2e991.firebaseapp.com",
      projectId: "expense-tracker-2e991",
      storageBucket: "expense-tracker-2e991.firebasestorage.app",
      messagingSenderId: "363528972811",
      appId: "1:363528972811:web:32f667858f8df59cae350e",
      measurementId: "G-VPQSHPQ5Z7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    document.getElementById('date').valueAsDate = new Date();

    const monthSelector = document.getElementById('displayMonth');
    const now = new Date();
    monthSelector.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    let chartInstance = null;
    let cachedAllData = []; 

    function renderAppForSelectedMonth() {
      const selectedMonthYYYYMM = monthSelector.value;
      if (!selectedMonthYYYYMM) return;

      let monthTotal = 0;
      let catTotals = {};
      let filteredHtml = '';

      cachedAllData.forEach((data) => {
        if (data.date && data.date.startsWith(selectedMonthYYYYMM)) {
          const amt = parseFloat(data.amount);
          monthTotal += amt;
          catTotals[data.category] = (catTotals[data.category] || 0) + amt;

          const transactionDate = new Date(data.date);
          const displayDate = transactionDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
          
          // Fallback to "Unknown" if old records don't have a payment mode saved
          const payMode = data.paymentMode || 'Unknown';

          filteredHtml += `
            <div class="flex justify-between items-center border-b pb-3 last:border-0 last:pb-0">
              <div class="flex items-center gap-3">
                <div class="bg-gray-100 p-3 rounded-full text-lg">${data.paidBy[0]}</div>
                <div>
                  <p class="font-bold text-gray-800">${data.description}</p>
                  <p class="text-xs text-gray-500">${displayDate} • ${data.paidBy} via ${payMode} • ${data.category}</p>
                </div>
              </div>
              <p class="font-bold text-red-500 text-lg">₹${amt.toFixed(2)}</p>
            </div>
          `;
        }
      });

      document.getElementById('totalSpent').innerText = `₹${monthTotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
      document.getElementById('expenseList').innerHTML = filteredHtml || '<p class="text-center text-gray-500 italic py-4">No data for this month.</p>';

      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      if (monthTotal === 0) return; 

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catTotals),
          datasets: [{
            data: Object.values(catTotals),
            backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#a855f7', '#ec4899', '#14b8a6'],
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 10
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15, font: { size: 12 } } }
          }
        }
      });
    }

    monthSelector.addEventListener('change', renderAppForSelectedMonth);

    const q = query(collection(db, "expenses"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      cachedAllData = []; 
      snapshot.forEach((doc) => {
        cachedAllData.push(doc.data());
      });
      renderAppForSelectedMonth();
    });

    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = 'Saving...';
      btn.disabled = true;
      
      try {
        await addDoc(collection(db, "expenses"), {
          amount: parseFloat(document.getElementById('amount').value),
          paidBy: document.getElementById('paidBy').value,
          category: document.getElementById('category').value,
          paymentMode: document.getElementById('paymentMode').value,
          date: document.getElementById('date').value,
          description: document.getElementById('desc').value,
          timestamp: new Date()
        });
        
        document.getElementById('amount').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('date').valueAsDate = new Date();
        document.querySelector('details').open = false;
        
      } catch (err) {
        console.error("Error saving data:", err);
        alert("Failed to save. Check internet connection.");
      } finally {
        btn.innerText = 'Log Expense';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
