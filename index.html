<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Our Expenses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 pb-24 max-w-md mx-auto font-sans">
  
  <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Shared Expenses</h1>
  
  <!-- Data Entry / Edit Form -->
  <details id="expenseFormDetails" class="bg-white p-4 rounded-xl shadow-sm mb-4 group" open>
    <summary class="flex justify-between items-center cursor-pointer text-gray-600">
      <span id="formTitle" class="font-semibold text-lg text-blue-700">Log New Expense</span>
      <span class="group-open:rotate-180 transform transition-transform">▼</span>
    </summary>
    <form id="expenseForm" class="space-y-4 pt-4 mt-2 border-t">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Amount (₹)</label>
          <input type="number" id="amount" step="0.01" required class="w-full border rounded-lg p-2 bg-gray-50" placeholder="0.00">
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Paid By</label>
          <select id="paidBy" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>Mereena</option>
            <option>Sudhin</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Category</label>
          <select id="category" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>Groceries</option>
            <option>Food & Dining</option>
            <option>Utilities</option>
            <option>Rent</option>
            <option>EMI</option>
            <option>Vehicle & Fuel</option>
            <option>Travel</option>
            <option>Loan</option>
            <option>Shopping</option>
            <option>Investment</option>
            <option>Entertainment</option>
            <option>Misc</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Payment Mode</label>
          <select id="paymentMode" class="w-full border rounded-lg p-2 bg-gray-50">
            <option>UPI</option>
            <option>Credit/Debit Card</option>
            <option>Cash</option>
            <option>Net Banking</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Date</label>
        <input type="date" id="date" required class="w-full border rounded-lg p-2 bg-gray-50">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Description</label>
        <input type="text" id="desc" required class="w-full border rounded-lg p-2 bg-gray-50" placeholder="e.g., Weekly groceries">
      </div>
      
      <div class="flex gap-2 pt-2">
        <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition">Log Expense</button>
        <button type="button" id="cancelEditBtn" class="hidden flex-1 bg-gray-400 text-white font-bold py-3 rounded-lg shadow-md hover:bg-gray-500 transition">Cancel Edit</button>
      </div>
    </form>
  </details>

  <!-- Filter & Grouping Section -->
  <details class="bg-white p-4 rounded-xl shadow-sm mb-6 group">
    <summary class="flex justify-between items-center cursor-pointer text-gray-600">
      <span class="font-semibold text-md">Filters & Categories</span>
      <span class="group-open:rotate-180 transform transition-transform">▼</span>
    </summary>
    <div class="pt-4 mt-2 border-t">
      <p class="text-xs text-gray-500 mb-3">Uncheck categories to hide them from the totals and charts below.</p>
      <div id="categoryFilters" class="grid grid-cols-2 gap-y-2 gap-x-1 text-sm text-gray-700">
        <!-- JS will auto-populate checkboxes here based on the select dropdown -->
      </div>
    </div>
  </details>

  <!-- Dashboard Breakdown (Single Month) -->
  <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
    <div class="flex justify-between items-center mb-5 pb-2 border-b">
      <h2 class="text-xl font-bold text-gray-800">Month Overview</h2>
      <input type="month" id="displayMonth" class="border rounded-lg p-2 text-sm bg-gray-50 font-bold">
    </div>

    <!-- Group By Summaries -->
    <div class="grid grid-cols-2 gap-3 mb-5">
      <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
        <h3 class="text-[10px] font-bold text-indigo-800 mb-2 tracking-wider">PAID BY</h3>
        <div id="personSummary" class="text-sm text-indigo-900 space-y-1"></div>
      </div>
      <div class="bg-teal-50 p-3 rounded-xl border border-teal-100">
        <h3 class="text-[10px] font-bold text-teal-800 mb-2 tracking-wider">PAYMENT MODE</h3>
        <div id="modeSummary" class="text-sm text-teal-900 space-y-1"></div>
      </div>
    </div>

    <div class="mb-5 text-center">
      <h2 class="text-xs font-bold text-gray-500 mb-1">TOTAL FOR SELECTED MONTH</h2>
      <p class="text-4xl font-extrabold text-gray-900" id="totalSpent">₹0</p>
    </div>

    <div class="h-64 mb-2">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- Monthly Trend Analysis -->
  <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
    <h2 class="text-xl font-bold text-gray-800 mb-2 pb-2 border-b">Spend Trends (All Months)</h2>
    <p class="text-xs text-gray-500 mb-4">Category-wise monthly breakdown</p>
    <div class="h-64 mb-2">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- Transactions List -->
  <div class="bg-white p-4 rounded-xl shadow-sm">
    <h2 class="text-sm font-bold text-gray-500 mb-4 uppercase tracking-wider">Transactions</h2>
    <div id="expenseList" class="space-y-3">
      <!-- Injected rows -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 🔴 REPLACE THIS BLOCK WITH YOUR ACTUAL FIREBASE KEYS
   const firebaseConfig = {
      apiKey: "AIzaSyDZWHm1lcBIXVYG0a-iKl_5e6Dj4xe2ShM",
      authDomain: "expense-tracker-2e991.firebaseapp.com",
      projectId: "expense-tracker-2e991",
      storageBucket: "expense-tracker-2e991.firebasestorage.app",
      messagingSenderId: "363528972811",
      appId: "1:363528972811:web:32f667858f8df59cae350e",
      measurementId: "G-VPQSHPQ5Z7"
    };	

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Global State
    let chartInstance = null;
    let trendChartInstance = null;
    let cachedAllData = []; 
    let editingDocId = null; 
    
    // Standard chart colors mapping
    const chartColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#a855f7', '#ec4899', '#14b8a6', '#f43f5e', '#84cc16', '#06b6d4', '#64748b'];

    // Init Dates
    document.getElementById('date').valueAsDate = new Date();
    const monthSelector = document.getElementById('displayMonth');
    const now = new Date();
    monthSelector.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // --- Dynamic Category Filters Setup ---
    const categoryOptions = Array.from(document.getElementById('category').options).map(o => o.value);
    let selectedFilters = new Set(categoryOptions); 

    const filterContainer = document.getElementById('categoryFilters');
    filterContainer.innerHTML = categoryOptions.map(cat => `
      <label class="flex items-center space-x-2 bg-gray-50 p-2 rounded-lg border cursor-pointer">
        <input type="checkbox" value="${cat}" checked class="category-filter rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
        <span class="truncate text-gray-700">${cat}</span>
      </label>
    `).join('');

    // Listen for filter changes
    filterContainer.addEventListener('change', (e) => {
      if (e.target.classList.contains('category-filter')) {
        if (e.target.checked) selectedFilters.add(e.target.value);
        else selectedFilters.delete(e.target.value);
        renderAppForSelectedMonth();
        renderTrendChart(); // Update trend chart too
      }
    });

    // --- Trend Chart Logic (Line Chart) ---
    function renderTrendChart() {
      if (!cachedAllData || cachedAllData.length === 0) return;

      const monthlyData = {};
      
      // Aggregate data by Month and Category
      cachedAllData.forEach((data) => {
        if (!selectedFilters.has(data.category)) return; // Respect checkboxes

        const monthKey = data.date.substring(0, 7); // Extracts "YYYY-MM"
        if (!monthlyData[monthKey]) monthlyData[monthKey] = {};
        
        const amt = parseFloat(data.amount);
        monthlyData[monthKey][data.category] = (monthlyData[monthKey][data.category] || 0) + amt;
      });

      // Sort months chronologically
      const sortedMonths = Object.keys(monthlyData).sort();
      if (sortedMonths.length === 0) {
          if(trendChartInstance) trendChartInstance.destroy();
          return;
      }

      // Generate datasets mapped to standard colors
      const datasets = [];
      categoryOptions.forEach((cat, index) => {
        if (!selectedFilters.has(cat)) return;
        
        const dataForCat = sortedMonths.map(month => monthlyData[month][cat] || 0);
        
        // Only add dataset if it has > 0 value in at least one month
        if (dataForCat.some(val => val > 0)) {
            const color = chartColors[index % chartColors.length];
            datasets.push({
                label: cat,
                data: dataForCat,
                backgroundColor: color,
                borderColor: color, // Ensure the line has the correct color
                borderWidth: 2,     // Thickness of the line
                pointRadius: 3,     // Visible points
                pointHoverRadius: 6,
                tension: 0.3        // Slight curve to the lines
            });
        }
      });

      // Format X-axis labels (e.g., "Jan 23", "Feb 23")
      const labels = sortedMonths.map(m => {
          const d = new Date(m + '-01');
          return d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
      });

      const ctx = document.getElementById('trendChart').getContext('2d');
      if (trendChartInstance) trendChartInstance.destroy();

      trendChartInstance = new Chart(ctx, {
        type: 'line', // Changed to Line Chart
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true } // Let multiple lines overlap instead of stacking
          },
          plugins: {
            legend: { 
                position: 'bottom', 
                labels: { boxWidth: 10, font: { size: 10 }, padding: 10 } 
            },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        let label = context.dataset.label || '';
                        if (label) label += ': ';
                        if (context.parsed.y !== null) {
                            label += '₹' + context.parsed.y.toLocaleString('en-IN');
                        }
                        return label;
                    }
                }
            }
          }
        }
      });
    }

    // --- Core Render Logic ---
    function renderAppForSelectedMonth() {
      const selectedMonthYYYYMM = monthSelector.value;
      if (!selectedMonthYYYYMM) return;

      let monthTotal = 0;
      let catTotals = {};
      let personTotals = {};
      let modeTotals = {};
      let filteredHtml = '';

      cachedAllData.forEach((data) => {
        // Filter by Month AND Checkboxes
        if (data.date && data.date.startsWith(selectedMonthYYYYMM) && selectedFilters.has(data.category)) {
          const amt = parseFloat(data.amount);
          monthTotal += amt;
          
          // Aggregations
          catTotals[data.category] = (catTotals[data.category] || 0) + amt;
          personTotals[data.paidBy] = (personTotals[data.paidBy] || 0) + amt;
          
          const payMode = data.paymentMode || 'Unknown';
          modeTotals[payMode] = (modeTotals[payMode] || 0) + amt;

          const transactionDate = new Date(data.date);
          const displayDate = transactionDate.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });

          filteredHtml += `
            <div class="flex justify-between items-center border-b pb-3 last:border-0 last:pb-0">
              <div class="flex items-center gap-3">
                <div class="bg-gray-100 w-10 h-10 flex items-center justify-center rounded-full font-bold text-gray-600">${data.paidBy[0]}</div>
                <div>
                  <p class="font-bold text-gray-800">${data.description}</p>
                  <p class="text-[11px] text-gray-500">${displayDate} • ${payMode} • ${data.category}</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <p class="font-bold text-red-500">₹${amt.toFixed(2)}</p>
                <button data-id="${data.id}" class="edit-btn text-blue-500 bg-blue-50 p-2 rounded-lg hover:bg-blue-100 transition">✏️</button>
              </div>
            </div>
          `;
        }
      });

      // Update UI Summaries
      document.getElementById('totalSpent').innerText = `₹${monthTotal.toLocaleString('en-IN', { minimumFractionDigits: 0 })}`;
      document.getElementById('expenseList').innerHTML = filteredHtml || '<p class="text-center text-gray-500 italic py-4">No data matches filters.</p>';

      document.getElementById('personSummary').innerHTML = Object.keys(personTotals).length ? Object.entries(personTotals)
        .map(([p, a]) => `<div class="flex justify-between"><span>${p}:</span> <strong>₹${a.toFixed(0)}</strong></div>`).join('') : '<em>None</em>';
        
      document.getElementById('modeSummary').innerHTML = Object.keys(modeTotals).length ? Object.entries(modeTotals)
        .map(([m, a]) => `<div class="flex justify-between"><span>${m}:</span> <strong>₹${a.toFixed(0)}</strong></div>`).join('') : '<em>None</em>';

      // Update Doughnut Chart (Single Month)
      const ctx = document.getElementById('expenseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      if (monthTotal > 0) {
        // Map colors consistently with the Trend Chart
        const bgColors = Object.keys(catTotals).map(cat => {
            const index = categoryOptions.indexOf(cat);
            return chartColors[index % chartColors.length];
        });

        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(catTotals),
            datasets: [{
              data: Object.values(catTotals),
              backgroundColor: bgColors,
              borderWidth: 2, borderColor: '#ffffff', hoverOffset: 5
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
        });
      }
    }

    // --- Listeners ---
    monthSelector.addEventListener('change', renderAppForSelectedMonth);

    // Fetch Data
    const q = query(collection(db, "expenses"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
      cachedAllData = []; 
      snapshot.forEach((doc) => {
        cachedAllData.push({ id: doc.id, ...doc.data() });
      });
      renderAppForSelectedMonth();
      renderTrendChart(); // Initial load of trend chart
    });

    // --- Edit Logic ---
    function resetForm() {
      editingDocId = null;
      document.getElementById('formTitle').innerText = 'Log New Expense';
      document.getElementById('formTitle').className = 'font-semibold text-lg text-blue-700';
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'Log Expense';
      submitBtn.className = 'flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition';
      
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('amount').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('date').valueAsDate = new Date();
    }

    document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

    document.getElementById('expenseList').addEventListener('click', (e) => {
      const editBtn = e.target.closest('.edit-btn');
      if (editBtn) {
        const id = editBtn.dataset.id;
        const expense = cachedAllData.find(ex => ex.id === id);
        if (expense) {
          // Fill form
          document.getElementById('amount').value = expense.amount;
          document.getElementById('paidBy').value = expense.paidBy;
          document.getElementById('category').value = expense.category;
          document.getElementById('paymentMode').value = expense.paymentMode || 'UPI';
          document.getElementById('date').value = expense.date;
          document.getElementById('desc').value = expense.description;
          
          // Change UI to Edit Mode
          editingDocId = id;
          document.getElementById('formTitle').innerText = 'Editing Expense...';
          document.getElementById('formTitle').className = 'font-semibold text-lg text-amber-600 animate-pulse';
          
          const submitBtn = document.getElementById('submitBtn');
          submitBtn.innerText = 'Update Expense';
          submitBtn.className = 'flex-1 bg-amber-500 text-white font-bold py-3 rounded-lg shadow-md hover:bg-amber-600 active:scale-95 transition';
          
          document.getElementById('cancelEditBtn').classList.remove('hidden');
          
          // Open details tag and scroll to top
          document.getElementById('expenseFormDetails').open = true;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    });

    // --- Save / Update ---
    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Saving...';
      btn.disabled = true;
      
      const payload = {
        amount: parseFloat(document.getElementById('amount').value),
        paidBy: document.getElementById('paidBy').value,
        category: document.getElementById('category').value,
        paymentMode: document.getElementById('paymentMode').value,
        date: document.getElementById('date').value,
        description: document.getElementById('desc').value,
        timestamp: new Date()
      };

      try {
        if (editingDocId) {
          await updateDoc(doc(db, "expenses", editingDocId), payload);
        } else {
          await addDoc(collection(db, "expenses"), payload);
        }
        resetForm();
        document.getElementById('expenseFormDetails').open = false; // Collapse on success
      } catch (err) {
        console.error("Error saving data:", err);
        alert("Failed to save. Check internet connection.");
        btn.innerText = editingDocId ? 'Update Expense' : 'Log Expense';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
